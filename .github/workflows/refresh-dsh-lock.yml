name: refresh-dsh-lock

on:
  push:
    branches:
      - chore/dsh-rc7-baseline
    paths:
      - .github/workflows/refresh-dsh-lock.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
          registry-url: https://registry.npmjs.org

      - name: Pin npm
        run: npm install --global npm@12.0.1 --ignore-scripts --no-audit --no-fund

      - name: Generate clean lockfile without lifecycle scripts
        shell: bash
        run: |
          rm package-lock.json
          timeout 300s npm install --package-lock-only --ignore-scripts --no-audit --no-fund --timing

      - name: Verify coordinated DSH lock closure
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          const expected = '0.1.1-rc.2'
          const root = lock.packages?.['']?.devDependencies?.['@deepseek-ai/dsh']
          if (root !== expected) {
            throw new Error(`root lock DSH version ${String(root)} != ${expected}`)
          }
          const dshEntries = Object.entries(lock.packages ?? {}).filter(([path]) =>
            path.startsWith('node_modules/@deepseek-ai/dsh'),
          )
          const mismatches = dshEntries
            .filter(([, entry]) => entry.version !== expected)
            .map(([path, entry]) => [path, entry.version])
          if (mismatches.length > 0) {
            throw new Error(`mixed DSH closure: ${JSON.stringify(mismatches)}`)
          }
          if (dshEntries.length === 0) throw new Error('no DSH packages found in regenerated lock')
          console.log(`verified ${expected} across ${dshEntries.length} DSH package entries`)
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: package-lock-0.1.1-rc.2-clean
          path: package-lock.json
          if-no-files-found: error

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: refresh DSH 0.1.1-rc.2 lockfile'
          git push origin HEAD:${GITHUB_REF_NAME}
