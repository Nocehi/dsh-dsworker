name: diagnose-dsh-lock-resolution

on:
  push:
    branches:
      - chore/dsh-rc7-baseline
    paths:
      - .github/workflows/refresh-dsh-lock.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'

      - name: Pin npm without registry auth configuration
        run: npm install --global npm@12.0.1 --ignore-scripts --no-audit --no-fund

      - name: Probe registry metadata
        shell: bash
        run: |
          npm --version
          npm config get registry
          timeout 30s npm ping
          timeout 30s npm view @deepseek-ai/dsh@0.1.1-rc.2 version --json

      - name: Probe minimal DSH closure
        id: minimal
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p /tmp/dsh-minimal
          cd /tmp/dsh-minimal
          printf '{"name":"dsh-minimal","version":"0.0.0","private":true,"dependencies":{"@deepseek-ai/dsh":"0.1.1-rc.2"}}\n' > package.json
          timeout 120s npm install --package-lock-only --ignore-scripts --no-audit --no-fund --timing --loglevel=verbose

      - name: Probe full dsworker closure with normal peer resolution
        id: full
        continue-on-error: true
        shell: bash
        run: |
          rm -f package-lock.json
          timeout 180s npm install --package-lock-only --ignore-scripts --no-audit --no-fund --timing --loglevel=verbose

      - name: Probe full dsworker closure with legacy peer resolution
        id: legacy
        continue-on-error: true
        shell: bash
        run: |
          rm -f package-lock.json
          timeout 120s npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps --timing --loglevel=verbose

      - name: Record probe outcomes
        shell: bash
        run: |
          echo "minimal=${{ steps.minimal.outcome }}"
          echo "full=${{ steps.full.outcome }}"
          echo "legacy=${{ steps.legacy.outcome }}"
          test "${{ steps.minimal.outcome }}" = success
