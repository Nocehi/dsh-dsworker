name: diagnose-npm12-peer-resolution

on:
  push:
    branches:
      - chore/dsh-rc7-baseline
    paths:
      - .github/workflows/refresh-dsh-lock.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'

      - name: Select newest npm 12
        shell: bash
        run: |
          echo "bundled_npm=$(npm --version)"
          npm install --global npm@12 --ignore-scripts --no-audit --no-fund
          echo "selected_npm=$(npm --version)"
          npm config get registry
          npm view @deepseek-ai/dsh@0.1.1-rc.2 version --json

      - name: Probe minimal DSH closure with newest npm 12
        id: minimal
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p /tmp/dsh-minimal-new-npm
          cd /tmp/dsh-minimal-new-npm
          printf '{"name":"dsh-minimal","version":"0.0.0","private":true,"dependencies":{"@deepseek-ai/dsh":"0.1.1-rc.2"}}\n' > package.json
          timeout 120s npm install --package-lock-only --ignore-scripts --no-audit --no-fund --timing

      - name: Probe full dsworker closure with newest npm 12
        id: full
        continue-on-error: true
        shell: bash
        run: |
          rm -f package-lock.json
          timeout 180s npm install --package-lock-only --ignore-scripts --no-audit --no-fund --timing

      - name: Record probe outcomes
        shell: bash
        run: |
          echo "minimal=${{ steps.minimal.outcome }}"
          echo "full=${{ steps.full.outcome }}"
          test "${{ steps.minimal.outcome }}" = success
          test "${{ steps.full.outcome }}" = success
